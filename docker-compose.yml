version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pharmacy
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:6.0
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongodata:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'

  ocr-service:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./ocr:/app
    command: >
      sh -c "pip install -q flask pytesseract Pillow &&
             apt-get update -q && apt-get install -y -q tesseract-ocr &&
             python server.py"
    ports:
      - '8080:8080'
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PRISMA_VERSION: "6.8.0"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
      redis:
        condition: service_started
    environment:
      DB_URL: "postgresql://postgres:postgres@postgres:5432/pharmacy?schema=public"
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/pharmacy?schema=public"
      MONGODB_URL: "mongodb://mongo:27017/pharmacy"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "supersecretkey"
      OCR_SERVICE_URL: "http://ocr-service:8080/ocr"
    ports:
      - '3001:3000'
    volumes:
      - ./backend/src:/app/src
    command: >
      sh -c "npx prisma@6 migrate deploy &&
             node dist/main"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:3001"
    volumes:
      - ./frontend/app:/app/app
    command: npm run dev

volumes:
  pgdata:
  mongodata: