version: '3.8'
services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    image: zsyst-app:dev
    volumes:
      - ./:/var/www/html:cached
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: 'true'
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: '5432'
      DB_DATABASE: zsyst
      DB_USERNAME: zsyst
      DB_PASSWORD: zsyst_password
      REDIS_HOST: redis
    depends_on:
      - db
      - redis
    command: sh -c "php artisan serve --host=0.0.0.0 --port=8000"

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: zsyst
      POSTGRES_USER: zsyst
      POSTGRES_PASSWORD: zsyst_password
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  db-data:
