; One container, two processes. Render supervises exactly one process per
; service, so supervisord is that process and it keeps nginx and php-fpm alive.
;
; Both log to stdout/stderr (maxbytes=0 disables supervisord's own rotation) so
; Render's log stream shows them interleaved and nothing is written to the
; container's ephemeral disk.

[supervisord]
nodaemon = false
user = root
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /run/supervisord.pid

; Start php-fpm first: nginx would otherwise 502 on the earliest requests.
[program:php-fpm]
command = php-fpm --nodaemonize --force-stderr
autostart = true
autorestart = true
startsecs = 1
startretries = 3
stopwaitsecs = 30
priority = 10
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:nginx]
command = nginx -g "daemon off;"
autostart = true
autorestart = true
startsecs = 1
startretries = 3
stopwaitsecs = 15
priority = 20
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
