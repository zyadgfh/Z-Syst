; php-fpm pool for the Z-Syst container.
;
; This file deliberately REPLACES the image's default www.conf. The reason is a
; single directive: clear_env.
;
; php-fpm's documented default is `clear_env = yes`, which strips the
; environment from worker processes. Render injects configuration (DB_PASSWORD,
; APP_KEY, SUPABASE_*, ...) as environment variables, so with the default the
; application would boot with no database credentials at all. Some base images
; ship clear_env = no; depending on that would mean a total outage the day the
; base image changes. Setting it explicitly makes the contract ours.
;
; Related: docker/php.ini sets variables_order = "EGPCS" so the variables are
; visible through $_ENV as well as $_SERVER and getenv(). Laravel's env()
; repository reads those, and this codebase calls env() directly in 451 places
; outside config/ (notably resources/views/admin/settings/system.blade.php), so
; environment visibility is load-bearing here, not a nicety.

[www]
user = www-data
group = www-data

; nginx proxies to this address over the container loopback (see
; docker/nginx.conf.template). Same-container TCP avoids managing unix-socket
; permissions between two processes.
listen = 127.0.0.1:9000

; THE important line — see the header.
clear_env = no

listen.owner = www-data
listen.group = www-data

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Must be >= nginx's fastcgi_read_timeout (120s) so nginx is the one that gives
; up, and the error it returns is a 504 you can see rather than a silent reset.
request_terminate_timeout = 130s

; Pass PATH/SCRIPT_* through to Laravel's front controller.
catch_workers_output = yes
decorate_workers_output = no

; php-fpm's own status/ping are not exposed to nginx; keep them off.
pm.status_path =
