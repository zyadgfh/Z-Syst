; Production PHP settings for the Z-Syst container.
; Loaded last (99-) so it wins over the image defaults.

; --- environment visibility --------------------------------------------------
; E populates $_ENV in addition to $_SERVER and getenv(). Laravel's env()
; repository reads those, and this application calls env() directly in 451
; places outside config/ — including the admin system-settings Blade view — so
; without this the values injected by Render would be invisible to them.
; Pairs with `clear_env = no` in docker/php-fpm-pool.conf.
variables_order = "EGPCS"

; --- exposure & errors -------------------------------------------------------
expose_php = Off
log_errors = On
error_log = /dev/stderr
; APP_DEBUG=false in production; this only governs what PHP itself would show.
display_errors = Off
display_startup_errors = Off

; --- limits ------------------------------------------------------------------
; Sized for the Excel imports/exports (maatwebsite/excel) and PDF generation,
; which are the heaviest requests this app serves. Keep post_max_size a little
; above upload_max_filesize, and keep nginx's client_max_body_size in step
; (docker/nginx.conf.template) or nginx rejects the body before PHP sees it.
memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 72M
max_execution_time = 120
max_input_vars = 5000

; --- sessions / files --------------------------------------------------------
; SESSION_DRIVER=file writes here. On Render this path must live on the mounted
; disk, otherwise every deploy logs everybody out (RUNBOOK §7).
session.save_path = /var/www/html/storage/framework/sessions
session.cookie_secure = 1
session.cookie_httponly = 1
session.cookie_samesite = lax
session.use_strict_mode = 1

; --- realpath cache ----------------------------------------------------------
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; --- opcache -----------------------------------------------------------------
opcache.enable = 1
; CLI (artisan, schedule:run) is short-lived; caching bytecode there buys
; nothing and would outlive the process that produced it.
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; The image is immutable: files cannot change at runtime, so never re-stat them.
opcache.validate_timestamps = 0
; Laravel reads docblock annotations; stripping comments would break them.
opcache.save_comments = 1
opcache.fast_shutdown = 1
