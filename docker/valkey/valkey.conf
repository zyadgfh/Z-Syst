# =============================================================================
# Z-Syst — Valkey configuration (drop-in Redis replacement)
# =============================================================================
# Valkey (https://valkey.io) is the BSD-licensed, Linux Foundation-backed fork
# of Redis. It speaks the same protocol, so Laravel keeps using the `redis`
# driver with no code changes.
#
# This file is mounted read-only at /etc/valkey/valkey.conf by
# docker-compose.valkey.yml. The password is NOT stored here — it is passed
# at startup via --requirepass from REDIS_PASSWORD in .env.
#
# Full reference: https://valkey.io/topics/config/
# =============================================================================

# Networking (inside the container). The compose file publishes the port to
# 127.0.0.1 on the host only — never expose Valkey directly to the internet.
bind 0.0.0.0
protected-mode yes
port 6379
tcp-keepalive 300
timeout 0

# --- Multithreaded I/O ---------------------------------------------------------
# Valkey can spread network I/O across threads. Set to the number of CPU cores
# you want to dedicate to Valkey (2 is a good start on a 2-4 core VPS).
io-threads 2

# --- Persistence ---------------------------------------------------------------
# AOF keeps queued jobs and sessions safe across restarts (fsync every second).
appendonly yes
appendfsync everysec
dir /data

# RDB snapshots as an extra safety net / for backups.
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
rdbcompression yes

# --- Memory --------------------------------------------------------------------
# Adjust to your server (leave RAM for PHP/MySQL if co-located).
# volatile-lru evicts ONLY keys that have a TTL — Laravel cache and session
# keys carry a TTL, while queue jobs do not, so jobs are never evicted.
# Do NOT use allkeys-lru/allkeys-random here: they could evict queue jobs.
maxmemory 512mb
maxmemory-policy volatile-lru

# --- Logging -------------------------------------------------------------------
# Empty logfile = log to stdout (collected by Docker).
logfile ""
loglevel notice

# --- Slow log ------------------------------------------------------------------
slowlog-log-slower-than 10000
slowlog-max-len 128
