<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude AI - مجاناً</title>
    <script src="https://js.puter.com/v2/"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            height: 90vh;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        /* Header */
        .header {
            padding: 20px 24px;
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #d4a574, #c47a4a);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            color: white;
        }

        .header h1 {
            color: white;
            font-size: 20px;
            font-weight: 600;
        }

        .header h1 span {
            color: #d4a574;
        }

        .header-badge {
            background: rgba(212, 165, 116, 0.2);
            color: #d4a574;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            border: 1px solid rgba(212, 165, 116, 0.3);
        }

        /* Model Selector */
        .model-bar {
            padding: 12px 24px;
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .model-bar label {
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            font-weight: 500;
        }

        .model-select {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
            outline: none;
            min-width: 180px;
        }

        .model-select option {
            background: #1a1a2e;
            color: white;
        }

        .btn-clear {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
            margin-right: auto;
        }

        .btn-clear:hover {
            background: rgba(255, 80, 80, 0.2);
            border-color: rgba(255, 80, 80, 0.3);
            color: #ff6b6b;
        }

        /* Chat Messages */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 85%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message.assistant {
            align-self: flex-start;
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .message.assistant .message-avatar {
            background: linear-gradient(135deg, #d4a574, #c47a4a);
        }

        .message-content {
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.9);
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-content {
            background: rgba(255, 255, 255, 0.08);
            border-bottom-left-radius: 4px;
        }

        .message-content p {
            margin-bottom: 8px;
        }

        .message-content p:last-child {
            margin-bottom: 0;
        }

        .message-content code {
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
            font-family: 'Consolas', 'Courier New', monospace;
        }

        .message-content pre {
            background: rgba(0, 0, 0, 0.4);
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0;
            direction: ltr;
            text-align: left;
        }

        .message-content pre code {
            background: none;
            padding: 0;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 4px 0;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
            30% { transform: translateY(-8px); opacity: 1; }
        }

        /* Input Area */
        .input-area {
            padding: 20px 24px;
            background: rgba(0, 0, 0, 0.2);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .input-wrapper textarea {
            flex: 1;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            padding: 14px 18px;
            color: white;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            outline: none;
            min-height: 52px;
            max-height: 150px;
            transition: border-color 0.3s;
        }

        .input-wrapper textarea:focus {
            border-color: rgba(212, 165, 116, 0.5);
        }

        .input-wrapper textarea::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .btn-send {
            background: linear-gradient(135deg, #d4a574, #c47a4a);
            color: white;
            border: none;
            width: 52px;
            height: 52px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .btn-send:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(212, 165, 116, 0.3);
        }

        .btn-send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-send.loading {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        /* Welcome Message */
        .welcome {
            text-align: center;
            padding: 40px 20px;
            color: rgba(255, 255, 255, 0.6);
        }

        .welcome-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .welcome h2 {
            color: white;
            font-size: 24px;
            margin-bottom: 12px;
        }

        .welcome p {
            font-size: 14px;
            line-height: 1.8;
            max-width: 500px;
            margin: 0 auto;
        }

        .welcome .features {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 24px;
        }

        .welcome .feature-tag {
            background: rgba(255, 255, 255, 0.08);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Error message */
        .message.error .message-content {
            background: rgba(255, 80, 80, 0.2);
            border: 1px solid rgba(255, 80, 80, 0.3);
            color: #ff6b6b;
        }

        /* Responsive */
        @media (max-width: 600px) {
            body {
                padding: 0;
            }
            .container {
                height: 100vh;
                border-radius: 0;
            }
            .message {
                max-width: 95%;
            }
            .header h1 {
                font-size: 16px;
            }
            .model-bar {
                padding: 10px 16px;
            }
            .model-select {
                min-width: 140px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <div class="logo">C</div>
                <h1>Claude <span>AI</span></h1>
            </div>
            <div class="header-badge">🆓 مجاني تماماً</div>
        </div>

        <!-- Model Selector -->
        <div class="model-bar">
            <label>🧠 النموذج:</label>
            <select class="model-select" id="modelSelect">
                <option value="claude-sonnet-5">Claude Sonnet 5 (الأفضل)</option>
                <option value="claude-haiku-4-5">Claude Haiku 4.5 (الأسرع)</option>
                <option value="claude-opus-4-8">Claude Opus 4.8 (الأقوى)</option>
                <option value="claude-opus-4-5">Claude Opus 4.5</option>
                <option value="claude-sonnet-4">Claude Sonnet 4</option>
                <option value="claude-fable-5">Claude Fable 5</option>
            </select>
            <button class="btn-clear" onclick="clearChat()">🗑️ مسح المحادثة</button>
        </div>

        <!-- Chat Messages -->
        <div class="chat-messages" id="chatMessages">
            <div class="welcome" id="welcomeMessage">
                <div class="welcome-icon">🤖</div>
                <h2>مرحباً بك في Claude AI</h2>
                <p>
                    أنا Claude، مساعد ذكاء اصطناعي مجاني بالكامل. 
                    يمكنني مساعدتك في الكتابة، البرمجة، التحليل، الإجابة على أسئلتك، وأكثر!
                </p>
                <div class="features">
                    <span class="feature-tag">📝 كتابة نصوص</span>
                    <span class="feature-tag">💻 برمجة</span>
                    <span class="feature-tag">📊 تحليل</span>
                    <span class="feature-tag">🌍 ترجمة</span>
                    <span class="feature-tag">🎨 إبداع</span>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <div class="input-wrapper">
                <textarea id="userInput" placeholder="اكتب رسالتك هنا..." rows="1" oninput="autoResize(this)"></textarea>
                <button class="btn-send" id="sendBtn" onclick="sendMessage()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        let isStreaming = false;
        let abortController = null;

        // Auto-resize textarea
        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 150) + 'px';
        }

        // Send message on Enter (Shift+Enter for new line)
        document.getElementById('userInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Clear chat
        function clearChat() {
            const messagesContainer = document.getElementById('chatMessages');
            messagesContainer.innerHTML = `
                <div class="welcome" id="welcomeMessage">
                    <div class="welcome-icon">🤖</div>
                    <h2>مرحباً بك في Claude AI</h2>
                    <p>
                        أنا Claude، مساعد ذكاء اصطناعي مجاني بالكامل. 
                        يمكنني مساعدتك في الكتابة، البرمجة، التحليل، الإجابة على أسئلتك، وأكثر!
                    </p>
                    <div class="features">
                        <span class="feature-tag">📝 كتابة نصوص</span>
                        <span class="feature-tag">💻 برمجة</span>
                        <span class="feature-tag">📊 تحليل</span>
                        <span class="feature-tag">🌍 ترجمة</span>
                        <span class="feature-tag">🎨 إبداع</span>
                    </div>
                </div>
            `;
        }

        // Add message to chat
        function addMessage(role, content, isStreaming = false) {
            const messagesContainer = document.getElementById('chatMessages');
            const welcomeMessage = document.getElementById('welcomeMessage');
            if (welcomeMessage) welcomeMessage.remove();

            // Check if we already have a streaming message
            let existingMsg = document.querySelector('.message.streaming');
            if (isStreaming && existingMsg) {
                existingMsg.querySelector('.message-content').innerHTML = formatMessage(content);
                return;
            }

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}${isStreaming ? ' streaming' : ''}`;
            
            const avatar = role === 'user' ? '👤' : '🤖';
            
            messageDiv.innerHTML = `
                <div class="message-avatar">${avatar}</div>
                <div class="message-content">${isStreaming ? '' : formatMessage(content)}</div>
            `;

            if (isStreaming) {
                messageDiv.querySelector('.message-content').textContent = content;
            }

            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            
            return messageDiv;
        }

        // Format message with markdown-like syntax
        function formatMessage(text) {
            if (!text) return '';
            
            // Escape HTML
            let html = text.replace(/&/g, '&')
                           .replace(/</g, '<')
                           .replace(/>/g, '>');
            
            // Code blocks
            html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
            
            // Inline code
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
            
            // Bold
            html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            
            // Italic
            html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
            
            // Line breaks
            html = html.replace(/\n/g, '<br>');
            
            return html;
        }

        // Update streaming message
        function updateStreamingMessage(text) {
            const streamingMsg = document.querySelector('.message.streaming .message-content');
            if (streamingMsg) {
                streamingMsg.innerHTML = formatMessage(text);
                const messagesContainer = document.getElementById('chatMessages');
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }
        }

        // Show typing indicator
        function showTypingIndicator() {
            const messagesContainer = document.getElementById('chatMessages');
            const welcomeMessage = document.getElementById('welcomeMessage');
            if (welcomeMessage) welcomeMessage.remove();

            const indicator = document.createElement('div');
            indicator.className = 'message assistant typing-indicator-msg';
            indicator.id = 'typingIndicator';
            indicator.innerHTML = `
                <div class="message-avatar">🤖</div>
                <div class="message-content">
                    <div class="typing-indicator">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            `;
            messagesContainer.appendChild(indicator);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Remove typing indicator
        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }

        // Send message
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');
            const message = input.value.trim();

            if (!message || isStreaming) return;

            // Clear input
            input.value = '';
            input.style.height = 'auto';

            // Add user message
            addMessage('user', message);

            // Show typing indicator
            showTypingIndicator();

            // Disable button
            isStreaming = true;
            sendBtn.disabled = true;
            sendBtn.classList.add('loading');
            sendBtn.innerHTML = '⏳';

            const model = document.getElementById('modelSelect').value;

            try {
                // Remove typing indicator
                removeTypingIndicator();

                // Add streaming message container
                addMessage('assistant', '', true);

                // Start streaming
                const response = await puter.ai.chat(message, {
                    model: model,
                    stream: true
                });

                let fullResponse = '';

                for await (const part of response) {
                    if (part?.text) {
                        fullResponse += part.text;
                        updateStreamingMessage(fullResponse);
                    }
                }

                // Finalize message
                const streamingMsg = document.querySelector('.message.streaming');
                if (streamingMsg) {
                    streamingMsg.classList.remove('streaming');
                    streamingMsg.querySelector('.message-content').innerHTML = formatMessage(fullResponse);
                }

            } catch (error) {
                removeTypingIndicator();
                
                // Remove empty streaming message if exists
                const streamingMsg = document.querySelector('.message.streaming');
                if (streamingMsg) streamingMsg.remove();

                // Show error
                const errorDiv = document.createElement('div');
                errorDiv.className = 'message error';
                errorDiv.innerHTML = `
                    <div class="message-avatar">⚠️</div>
                    <div class="message-content">
                        <strong>حدث خطأ:</strong> ${error.message || 'تعذر الاتصال بـ Claude. تحقق من اتصالك بالإنترنت وحاول مرة أخرى.'}
                        <br><br>
                        <small>💡 تأكد من تحميل مكتبة Puter.js بشكل صحيح</small>
                    </div>
                `;
                document.getElementById('chatMessages').appendChild(errorDiv);
                document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
            }

            // Re-enable button
            isStreaming = false;
            sendBtn.disabled = false;
            sendBtn.classList.remove('loading');
            sendBtn.innerHTML = `
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            `;
        }

        // Initial focus
        document.getElementById('userInput').focus();
    </script>
</body>
</html>
