name: mobile_pos
description: A new Flutter project.

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none'
version: 1.0.0+1

#environment:
#  sdk: ">=2.12.0 <4.0.0"
environment:
  sdk: ^3.5.3
  flutter: ^3.27.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  intl:




  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  barcode_widget: ^2.0.4
  image_picker: ^1.1.2
  flutter_cart: ^0.0.9
  flutter_easyloading: ^3.0.5
  flutter_riverpod: ^2.6.1
  shimmer: ^3.0.0
  url_launcher: ^6.3.1
  flutter_feather_icons: ^2.0.0+1
  permission_handler: ^11.3.1
  shared_preferences: ^2.5.2
  restart_app: ^1.3.2
  pinput: ^5.0.1
  nb_utils: ^7.1.2
  pdf: ^3.11.3
  open_file: ^3.5.10
  path_provider: ^2.0.14
  provider: ^6.1.2
  http: ^1.3.0
  flutter_pdfview: ^1.4.0
  iconly: ^1.0.1
  intl_utils: ^2.8.10
  intl_phone_field: ^3.2.0
  flutter_svg: ^2.0.17
  animated_notch_bottom_bar:  ^1.0.3
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.2
  fl_chart: ^0.70.2
  print_bluetooth_thermal: ^1.1.6
  mobile_scanner: ^6.0.6
  excel: ^4.0.6
  file_picker: ^9.0.0
  flutter_typeahead: ^5.2.0
  esc_pos_utils_plus: ^2.0.4
  printing: ^5.14.2
  material_design_icons_flutter: ^7.0.7296
  convex_bottom_bar: ^3.2.0
  hugeicons: ^0.0.7
  dropdown_button2: ^2.3.9
  number_to_words: ^1.0.0
  qr_flutter: ^4.1.0
  skeletonizer: ^1.4.3
  infinite_scroll_pagination: ^4.1.0
  searchfield: ^1.2.4
  connectivity_plus: ^6.1.3



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  change_app_package_name: ^1.1.0
  icons_launcher: ^3.0.0


# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  uses-material-design: true
  generate: true
  assets:
    - images/
    - assets/
    - assets/logo/
    - assets/app_logo/

  fonts:
    - family: Poppins
      fonts:
        - asset: fonts/Poppins/Poppins-Thin.ttf
          weight: 100
        - asset: fonts/Poppins/Poppins-ExtraLight.ttf
          weight: 200
        - asset: fonts/Poppins/Poppins-Light.ttf
          weight: 300
        - asset: fonts/Poppins/Poppins-Regular.ttf
          weight: 400
        - asset: fonts/Poppins/Poppins-Medium.ttf
          weight: 500
        - asset: fonts/Poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: fonts/Poppins/Poppins-Bold.ttf
          weight: 700
        - asset: fonts/Poppins/Poppins-ExtraBold.ttf
          weight: 800
        - asset: fonts/Poppins/Poppins-Black.ttf
          weight: 900
    - family: NotoSans
      fonts:
        - asset: fonts/NotoSans/NotoSansBengali-Regular.ttf
          weight: 400

flutter_intl:
  enabled: true


icons_launcher:
  image_path: "assets/app_logo/app_icon.png"
  platforms:
    android:
      enable: true

    ios:
      enable: true
      image_path: "assets/app_logo/app_icon.png"
