name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # Blocking quality gates — must stay green on every PR.
  # ------------------------------------------------------------------
  php-quality:
    name: PHP — validate, lint, boot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, bcmath, gd, zip, mbstring, xml, intl, sqlite, pdo_sqlite, sqlite, pdo_sqlite
          coverage: none

      - name: Validate composer.json is in sync with composer.lock
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Syntax check every PHP file (php -l)
        run: |
          set +e
          FAIL=0; COUNT=0
          : > lint-failures.txt
          while IFS= read -r -d '' f; do
            COUNT=$((COUNT+1))
            OUT=$(php -l "$f" 2>&1)
            if [ $? -ne 0 ]; then
              echo "SYNTAX ERROR: $f"; echo "$OUT" | tail -2; FAIL=$((FAIL+1))
              { echo "== $f"; echo "$OUT"; } >> lint-failures.txt
              echo "- **$f**: $(echo "$OUT" | tail -1)" >> "$GITHUB_STEP_SUMMARY"
            fi
          done < <(find app Modules config database routes tests -name '*.php' -type f -print0)
          echo "linted $COUNT files, failures=$FAIL" | tee -a lint-failures.txt "$GITHUB_STEP_SUMMARY"
          exit $((FAIL > 0 ? 1 : 0))

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Boot gate — resolve routes, controllers, DI and providers
        if: success() || failure()
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: |
          php artisan route:list > boot.log 2>&1 || { php .github/scripts/emit_log_annotations.php boot.log "route:list boot"; exit 1; }

      - name: Push lint/boot diagnostics to ci-runtime orphan
        if: failure()
        run: |
          git config user.email ci@z-syst.local
          git config user.name ci
          git fetch origin ci-runtime || true
          git checkout --orphan ci-runtime-lint-tmp
          git rm -rf --cached . -q || true
          git add -f lint-failures.txt boot.log 2>/dev/null || true
          git commit -q -m "lint/boot diagnostics $(date -u +%FT%TZ)" || echo nothing to commit
          git branch -M ci-runtime-lint
          git push -q --force origin ci-runtime-lint || echo push failed

  # ------------------------------------------------------------------
  # Schema drift — blocking, and deliberately so. Production (Supabase) and
  # this repository's migrations drifted apart in silence: 137 columns the
  # models mass-assign did not exist live, and 24 production tables were
  # created by no migration at all. CI could not see any of it, because the
  # suite builds sqlite *from the migrations* — it validated a database that
  # was not production, so 398 green tests coexisted with features that
  # returned 500 live. This job locks the three sides together: models ↔
  # migrations ↔ production. It needs no secrets and no network access.
  # ------------------------------------------------------------------
  schema-drift:
    name: Schema drift — models vs migrations vs production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, bcmath, gd, zip, mbstring, xml, intl, sqlite, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Assert the migrated schema matches every model and every production table
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          SUPABASE_FALLBACK_ELOQUENT: 'true'
        run: vendor/bin/phpunit --colors=never --filter SchemaDriftTest

  # ------------------------------------------------------------------
  # Test suite — informational while the Path B runtime is being
  # stabilized (identity lives in Supabase GoTrue; see PROJECT_KB §5b
  # and docs/zsyst/16). Failures are reported as annotations but do not
  # block merges. Flip continue-on-error to false once
  # SUPABASE_ANON_KEY / SUPABASE_DB_PASSWORD exist as CI secrets and
  # integration tests are wired against them.
  # ------------------------------------------------------------------
  php-tests:
    name: PHPUnit (informational — Path B runtime pending)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, bcmath, gd, zip, mbstring, xml, intl, sqlite, pdo_sqlite, sqlite, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment (writes APP_KEY into .env.testing for APP_ENV=testing)
        env:
          APP_ENV: testing
        run: |
          # key:generate (and therefore migrate:fresh below) aborts when no env
          # file exists at all; mirror the Run PHPUnit job and seed one first.
          cp .env.example .env || true
          php artisan key:generate --ansi

      - name: Fresh sqlite schema
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan migrate:fresh --force

      - name: Run PHPUnit
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          SUPABASE_FALLBACK_ELOQUENT: 'true'
          CACHE_DRIVER: file
          CACHE_STORE: file
          SESSION_DRIVER: file
        run: vendor/bin/phpunit --colors=never

  # ------------------------------------------------------------------
  # Dependency advisories — informational until Path B dependency set
  # is stable; output stays visible as warnings.
  # ------------------------------------------------------------------
  composer-audit:
    name: Composer audit (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Audit locked dependencies
        run: composer audit --locked || echo "::warning::composer audit reported advisories — see log above"

  # ------------------------------------------------------------------
  # Flutter companion app — blocking: builds with the version pinned in
  # this workflow and runs a decoupled toolchain smoke test.
  # ------------------------------------------------------------------
  flutter:
    name: Flutter — pub get + smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pharmacy-store-app-codecanyon-main
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze (errors only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || echo "::warning::flutter analyze reported issues — see log"
      - name: Run smoke tests
        run: flutter test

