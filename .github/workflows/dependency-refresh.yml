name: Refresh Composer lock

on:
  push:
    branches:
      - codex/complete-hardening
    paths:
      - composer.json

permissions:
  contents: write

jobs:
  refresh:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, bcmath, gd, mbstring, xml, sqlite, pdo_sqlite, zip
      - run: composer update --with-all-dependencies --no-interaction --no-progress
      - run: composer audit --locked --no-interaction
      - name: Commit refreshed lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.json composer.lock
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh composer lock [skip ci]"
          git push origin HEAD:codex/complete-hardening
