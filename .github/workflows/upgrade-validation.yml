name: Laravel upgrade validation

on:
  pull_request:
    branches: [upgrade-laravel-12]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: PHP tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, pgsql, mysql]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: zsyst
          POSTGRES_PASSWORD: zsyst_test
          POSTGRES_DB: zsyst_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U zsyst -d zsyst_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: zsyst_test
          MYSQL_DATABASE: zsyst_test
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -pzsyst_test"
          --health-interval 10s --health-timeout 5s --health-retries 15
    env:
      APP_ENV: testing
      APP_KEY: 'base64:WbTsifOfl40J8KRpCFoBwLWQQ1HSY/cz+NabJdFjyQY='
      DB_CONNECTION: ${{ matrix.database }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.database == 'pgsql' && '5432' || '3306' }}
      DB_DATABASE: ${{ matrix.database == 'sqlite' && ':memory:' || 'zsyst_test' }}
      DB_USERNAME: ${{ matrix.database == 'pgsql' && 'zsyst' || 'root' }}
      DB_PASSWORD: zsyst_test
      CACHE_DRIVER: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, xml, zip, intl, gd, pdo_sqlite, pdo_pgsql, pdo_mysql
          coverage: none
      - name: Install locked dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Run test suite
        run: vendor/bin/phpunit --colors=never
