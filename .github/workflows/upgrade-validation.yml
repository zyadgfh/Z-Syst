name: Laravel upgrade validation

on:
  push:
    branches: ['arena/**']
  pull_request:
    branches: [upgrade-laravel-12]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upgrade-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, pgsql, mysql]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: zsyst
          POSTGRES_PASSWORD: zsyst_test
          POSTGRES_DB: zsyst_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U zsyst -d zsyst_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: zsyst_test
          MYSQL_DATABASE: zsyst_test
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -pzsyst_test"
          --health-interval 10s --health-timeout 5s --health-retries 15
    env:
      APP_ENV: testing
      APP_KEY: 'base64:WbTsifOfl40J8KRpCFoBwLWQQ1HSY/cz+NabJdFjyQY='
      DB_CONNECTION: ${{ matrix.database }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.database == 'pgsql' && '5432' || '3306' }}
      DB_DATABASE: ${{ matrix.database == 'sqlite' && ':memory:' || 'zsyst_test' }}
      DB_USERNAME: ${{ matrix.database == 'pgsql' && 'zsyst' || 'root' }}
      DB_PASSWORD: zsyst_test
      DB_SSLMODE: disable
      ZSYST_DISPOSABLE_DATABASE: 'yes'
      CACHE_DRIVER: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, xml, zip, intl, gd, pdo_sqlite, pdo_pgsql, pdo_mysql
          coverage: none
      - name: Install locked dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Probe application boot
        continue-on-error: true
        run: vendor/bin/phpunit --colors=never --filter ExampleTest --stop-on-error --log-junit smoke.xml
      - name: Summarize boot probe
        if: always()
        run: python3 scripts/ci/summarize-junit.py smoke.xml
      - name: Run last-unit concurrency test
        id: concurrency
        continue-on-error: true
        run: vendor/bin/phpunit --colors=never --filter StockAllocationConcurrencyTest --stop-on-error --log-junit concurrency.xml
      - name: Summarize concurrency test
        if: always()
        run: python3 scripts/ci/summarize-junit.py concurrency.xml
      - name: Run test suite
        run: vendor/bin/phpunit --colors=never --log-junit junit.xml
      - name: Summarize test failures
        if: always()
        run: python3 scripts/ci/summarize-junit.py junit.xml
      - name: Enforce concurrency test result
        if: always() && steps.concurrency.outcome == 'failure'
        run: exit 1
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-${{ matrix.database }}
          path: |
            junit.xml
            smoke.xml
            concurrency.xml
          if-no-files-found: warn

  flutter:
    name: Flutter widget tests (hosted runner)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pharmacy-store-app-codecanyon-main
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: stable
      - run: flutter pub get
      - run: flutter test

  report-tests:
    name: CI report unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest scripts/ci/test_summarize_junit.py -v
