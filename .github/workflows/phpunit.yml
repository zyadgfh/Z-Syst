name: Run PHPUnit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  tests:
    runs-on: ubuntu-latest
    services: {}
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, bcmath, gd, mbstring, xml, sqlite, pdo_sqlite, zip, intl

      - name: Get composer cache
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-progress --no-suggest --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env || true
          php -r "file_exists('.env') || copy('.env.example', '.env');"
          php artisan key:generate --ansi
        env:
          APP_ENV: testing

      - name: Run migrations
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan migrate --no-interaction --force

      - name: Run tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan test --verbosity=normal --colors=never --log-junit junit.xml

      - name: Surface failures as annotations
        if: failure()
        run: |
          php -r '
          $xml = @simplexml_load_file("junit.xml");
          if (!$xml) { echo "::error::no junit produced
"; exit(0); }
          foreach ($xml->xpath("//testcase") as $case) {
              foreach ($case->children() as $child) {
                  if (in_array($child->getName(), ["failure", "error"])) {
                      $msg = (string)($child["message"] ?? "");
                      $name = (string)$case["name"];
                      $class = (string)$case["class"];
                      echo "::error::{$class}::{$name} — " . substr(str_replace(["
", ""], " ", $msg), 0, 380) . "
";
                  }
              }
          }
          '
          grep -c "" junit.xml || true
