name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, mbstring, xml, mysql, bcmath, gd, intl, zip
          coverage: xdebug

      - name: Copy .env
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-progress --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate application key
        run: php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run tests
        run: php artisan test --coverage-clover=coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install dependencies
        run: composer install --no-progress --no-interaction

      - name: Run security audit
        run: composer audit

      - name: Install Laravel security checker
        run: composer require enlightn/security-checker --dev --no-interaction
      - name: Run Laravel security check
        run: vendor/bin/security-checker

  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install dependencies
        run: composer install --no-progress --no-interaction

      - name: Install PHPStan
        run: composer require phpstan/phpstan --dev --no-interaction
      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=2G

      - name: Install Pint
        run: composer require laravel/pint --dev --no-interaction
      - name: Run Pint
        run: vendor/bin/pint --test

  deploy-staging:
    name: Deploy to Staging
    needs: [test, security-scan, code-quality]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.z-syst.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Deploy to staging
        run: |
          echo "Deploying to staging..."
          # Add your deployment commands here
          # Example: rsync -avz ./ user@staging-server:/var/www/z-syst/

      - name: Run migrations on staging
        run: |
          ssh user@staging-server "cd /var/www/z-syst && php artisan migrate --force"

      - name: Clear cache on staging
        run: |
          ssh user@staging-server "cd /var/www/z-syst && php artisan cache:clear && php artisan config:cache && php artisan route:cache"

      - name: Health check
        run: curl -f https://staging.z-syst.com/health || exit 1

  deploy-production:
    name: Deploy to Production
    needs: [test, security-scan, code-quality]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://app.z-syst.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Create backup
        run: |
          echo "Creating backup..."
          # Add backup commands here

      - name: Deploy to production
        run: |
          echo "Deploying to production..."
          # Add your deployment commands here
          # Example: rsync -avz ./ user@production-server:/var/www/z-syst/

      - name: Run migrations on production
        run: |
          ssh user@production-server "cd /var/www/z-syst && php artisan migrate --force"

      - name: Clear cache on production
        run: |
          ssh user@production-server "cd /var/www/z-syst && php artisan cache:clear && php artisan config:cache && php artisan route:cache"

      - name: Restart queue workers
        run: |
          ssh user@production-server "sudo supervisorctl restart laravel-worker:*"

      - name: Health check
        run: curl -f https://app.z-syst.com/health || exit 1

      - name: Notify team
        run: |
          echo "Deployment to production successful!"
          # Add notification commands here (Slack, email, etc.)
