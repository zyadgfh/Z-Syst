name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    env:
      CACHE_DRIVER: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, mbstring, xml, sqlite, pdo_sqlite, bcmath, gd, intl, zip
          coverage: xdebug

      - name: Copy .env
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-progress --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate application keys for CI only
        run: |
          php artisan key:generate
          php artisan key:generate --env=testing

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run tests
        run: vendor/bin/phpunit --coverage-clover=coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install dependencies
        run: composer install --no-progress --no-interaction

      - name: Run security audit
        run: composer audit


  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install dependencies
        run: composer install --no-progress --no-interaction

      - name: Run PHPStan
        run: |
          if [ -x vendor/bin/phpstan ]; then
            vendor/bin/phpstan analyse --memory-limit=2G
          else
            echo 'PHPStan is not declared in composer.lock; skipping optional analysis.'
          fi

      - name: Run Pint
        run: |
          changed_php_files=$(git diff --name-only "origin/${GITHUB_BASE_REF}"...HEAD -- '*.php')
          if [ -n "$changed_php_files" ]; then
            vendor/bin/pint --test $changed_php_files
          else
            echo 'No PHP files changed; skipping Pint.'
          fi

  deploy-staging:
    name: Deploy to Staging
    needs: [test, security-scan, code-quality]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.z-syst.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Deploy to staging
        run: |
          echo "Deploying to staging..."
          # Add your deployment commands here
          # Example: rsync -avz ./ user@staging-server:/var/www/z-syst/

      - name: Run migrations on staging
        run: |
          ssh user@staging-server "cd /var/www/z-syst && php artisan migrate --force"

      - name: Clear cache on staging
        run: |
          ssh user@staging-server "cd /var/www/z-syst && php artisan cache:clear && php artisan config:cache && php artisan route:cache"

      - name: Health check
        run: curl -f https://staging.z-syst.com/health || exit 1

  deploy-production:
    name: Deploy to Production
    needs: [test, security-scan, code-quality]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://app.z-syst.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Create backup
        run: |
          echo "Creating backup..."
          # Add backup commands here

      - name: Deploy to production
        run: |
          echo "Deploying to production..."
          # Add your deployment commands here
          # Example: rsync -avz ./ user@production-server:/var/www/z-syst/

      - name: Run migrations on production
        run: |
          ssh user@production-server "cd /var/www/z-syst && php artisan migrate --force"

      - name: Clear cache on production
        run: |
          ssh user@production-server "cd /var/www/z-syst && php artisan cache:clear && php artisan config:cache && php artisan route:cache"

      - name: Restart queue workers
        run: |
          ssh user@production-server "sudo supervisorctl restart laravel-worker:*"

      - name: Health check
        run: curl -f https://app.z-syst.com/health || exit 1

      - name: Notify team
        run: |
          echo "Deployment to production successful!"
          # Add notification commands here (Slack, email, etc.)
