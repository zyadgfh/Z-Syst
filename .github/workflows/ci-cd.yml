name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PHP_VERSION: '8.3'
  COMPOSER_CACHE_DIR: composer-cache

jobs:
  # ──────────────────────────────────────────────
  # PR Jobs: Run only new-features test subset
  # ──────────────────────────────────────────────
  test-new-features:
    name: "Tests: New Features (PR subset)"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, sqlite3, bcmath, gd, intl, zip
          coverage: pcov
          tools: phpunit

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-progress --no-interaction --prefer-dist --optimize-autoloader

      - name: Run new-features tests with coverage
        run: |
          vendor/bin/phpunit --testsuite="CI-NewFeatures" \
            --coverage-clover=coverage-new-features.xml \
            --coverage-html=coverage/new-features/html \
            --coverage-text
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          CACHE_DRIVER: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage-new-features.xml
          flags: new-features
          name: new-features-coverage
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-new-features
          path: coverage/new-features/html/
          retention-days: 14

  security-scan-pr:
    name: "Security: Audit (PR)"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: Install dependencies
        run: composer install --no-progress --no-interaction

      - name: Run security audit
        run: composer audit

  code-quality-pr:
    name: "Quality: Pint + PHPStan (PR)"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: laravel-pint

      - name: Install dependencies
        run: composer install --no-progress --no-interaction

      - name: Run Pint (dry-run)
        run: vendor/bin/pint --test

  # ──────────────────────────────────────────────
  # Main/Develop Jobs: Full test suite
  # ──────────────────────────────────────────────
  test-full:
    name: "Tests: Full Suite"
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing
          MYSQL_USER: tester
          MYSQL_PASSWORD: tester
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, mysql, bcmath, gd, intl, zip
          coverage: pcov
          tools: phpunit

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-progress --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run full tests with coverage
        run: |
          vendor/bin/phpunit \
            --coverage-clover=coverage-full.xml \
            --coverage-html=coverage/full/html \
            --coverage-text
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          APP_ENV: testing
          CACHE_DRIVER: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync

      - name: Upload full coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage-full.xml
          flags: full-suite
          name: full-suite-coverage
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload full coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-full-suite
          path: coverage/full/html/
          retention-days: 30

  # ──────────────────────────────────────────────
  # Targeted coverage: Accounting + Recall suites
  # ──────────────────────────────────────────────
  coverage-accounting:
    name: "Coverage: Accounting Suite"
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, sqlite3, bcmath, gd, intl, zip
          coverage: pcov

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-progress --no-interaction --prefer-dist --optimize-autoloader

      - name: Run accounting tests with coverage
        run: |
          vendor/bin/phpunit \
            --testsuite="Coverage-Accounting" \
            --coverage-clover=coverage-accounting.xml \
            --coverage-html=coverage/accounting/html \
            --coverage-text
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          CACHE_DRIVER: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync

      - name: Upload accounting coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage-accounting.xml
          flags: accounting
          name: accounting-coverage
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload accounting coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-accounting
          path: coverage/accounting/html/
          retention-days: 30

      - name: Upload accounting coverage summary
        if: github.ref == 'refs/heads/main'
        run: |
          echo "### Accounting Coverage" >> $GITHUB_STEP_SUMMARY
          echo "Coverage report uploaded as artifact. See coverage/accounting/html/ for details." >> $GITHUB_STEP_SUMMARY

  coverage-recall:
    name: "Coverage: Recall & Traceability Suite"
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, sqlite3, bcmath, gd, intl, zip
          coverage: pcov

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-progress --no-interaction --prefer-dist --optimize-autoloader

      - name: Run recall/traceability tests with coverage
        run: |
          vendor/bin/phpunit \
            --testsuite="Coverage-Recall" \
            --coverage-clover=coverage-recall.xml \
            --coverage-html=coverage/recall/html \
            --coverage-text
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          CACHE_DRIVER: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync

      - name: Upload recall coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage-recall.xml
          flags: recall-traceability
          name: recall-coverage
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload recall coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-recall
          path: coverage/recall/html/
          retention-days: 30

  # ──────────────────────────────────────────────
  # Quality & Security (main only)
  # ──────────────────────────────────────────────
  security-scan:
    name: "Security: Audit"
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: Install dependencies
        run: composer install --no-progress --no-interaction

      - name: Run security audit
        run: composer audit

  code-quality:
    name: "Quality: Pint + PHPStan"
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: phpstan, laravel-pint

      - name: Install dependencies
        run: composer install --no-progress --no-interaction

      - name: Run Pint (dry-run)
        run: vendor/bin/pint --test

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=2G

  # ──────────────────────────────────────────────
  # Deployments
  # ──────────────────────────────────────────────
  deploy-staging:
    name: "Deploy: Staging"
    needs: [test-full, security-scan, code-quality]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: staging
      url: https://staging.z-syst.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: Install dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Deploy to staging
        run: |
          echo "Deploying to staging..."
          # Add your deployment commands here

      - name: Health check
        run: curl -f https://staging.z-syst.com/health || exit 1

  deploy-production:
    name: "Deploy: Production"
    needs: [test-full, security-scan, code-quality]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://app.z-syst.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: Install dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Deploy to production
        run: |
          echo "Deploying to production..."
          # Add your deployment commands here

      - name: Health check
        run: curl -f https://app.z-syst.com/health || exit 1
