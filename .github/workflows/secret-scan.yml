name: Secret Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  gitleaks:
    name: Incremental scan (this push / PR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run gitleaks scan
        uses: zricethezav/gitleaks-action@v1
        with:
          args: --redact
      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json

  # The job above cannot see history: actions/checkout defaults to fetch-depth 1
  # and gitleaks-action then scans only the commits in the event. Credentials
  # that were committed and later deleted remain retrievable from history for
  # ever, which is precisely what a pre-launch review has to answer. This job
  # clones the whole branch and runs gitleaks over every reachable commit.
  #
  # continue-on-error is deliberate. A historical finding cannot be fixed by the
  # PR that happens to trigger the run - it needs a rotation in the provider
  # dashboard and, optionally, a history rewrite - so a red check here would only
  # block unrelated work. Findings go to the job summary and to an artifact
  # instead, redacted so the artifact never becomes a second copy of the secret.
  gitleaks-history:
    name: Full history scan (every commit ever pushed)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan every reachable commit
        run: |
          set -uo pipefail
          # --exit-code 0 keeps this a report, not a gate. --redact=24 leaves
          # enough of each match to locate it without storing the credential.
          gitleaks detect \
            --source . \
            --log-opts="--all" \
            --config .gitleaks.toml \
            --redact=24 \
            --report-format json \
            --report-path gitleaks-history.json \
            --exit-code 0 \
            --verbose || true
          test -f gitleaks-history.json || echo "[]" > gitleaks-history.json

      - name: Write the summary to the job page
        if: always()
        run: |
          set -uo pipefail
          {
            echo "## Secret scan over full history"
            echo
            count=$(jq 'length' gitleaks-history.json 2>/dev/null || echo 0)
            echo "**${count} finding(s)** across every commit reachable from this ref."
            echo
            if [ "$count" -gt 0 ]; then
              echo "| rule | findings |"
              echo "| --- | --- |"
              jq -r 'group_by(.RuleID) | map({rule: .[0].RuleID, n: length}) | sort_by(-.n) | .[:20][] | "| `\(.rule)` | \(.n) |"' gitleaks-history.json
              echo
              echo "| file | findings |"
              echo "| --- | --- |"
              jq -r 'group_by(.File) | map({file: .[0].File, n: length}) | sort_by(-.n) | .[:20][] | "| `\(.file)` | \(.n) |"' gitleaks-history.json
              echo
              echo "Every finding must be **rotated in the provider dashboard**: deleting the file leaves the secret in history."
            else
              echo "Nothing matched the rules in \`.gitleaks.toml\`."
              echo
              echo "Scope note: only refs that still exist on the remote are scanned. A secret committed to a branch that was later deleted is invisible here, though GitHub can still serve it by SHA."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload history report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-history-report
          path: gitleaks-history.json
